spring:
  application:
    name: busca-produto-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/busca_produto}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
