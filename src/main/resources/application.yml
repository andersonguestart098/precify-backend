spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: busca-produto-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/busca_produto}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: classpath:keystore.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: buscaproduto

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  seed-demo-data: ${APP_SEED_DEMO_DATA:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://192.168.100.3:5173,https://busca-produto-frontend.vercel.app}
